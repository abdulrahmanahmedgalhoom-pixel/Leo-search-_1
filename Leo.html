    <script>
        const apiKey = ""; 
        let globalName = "";

        const langData = {
            ar: { welcome: "اهلا يا {name} انا Leo Search اتميز بالابداع", load: "جاري البحث في أعماق الإنترنت...", holder: "اسأل الأسد الأبيض عن أي شيء...", dir: "rtl" },

            zh: { welcome: "你好 {name}，我是 Leo Search，我的特点是创造力", load: "正在搜索互联网深处...", holder: "向 Leo Search 提问...", dir: "ltr" },

            es: { welcome: "Hola {name}, soy Leo Search, me distingo por la creatividad", load: "Buscando en las profundidades de Internet...", holder: "Pregúntale a Leo Search...", dir: "ltr" },
            pt: { welcome: "Olá {name}, eu sou Leo Search, eu me distingo pela criatividade", load: "Pesquisando nas profundezas da internet...", holder: "Pergunte ao Leo Search...", dir: "ltr" },
            it: { welcome: "Ciao {name}, sono Leo Search, mi distinguo per la creatività", load: "Ricerca nelle profondità di Internet...", holder: "Chiedi a Leo Search...", dir: "ltr" },
            tr: { welcome: "Merhaba {name}, ben Leo Search, yaratıcılığımla öne çıkarım", load: "İnternetin derinliklerinde aranıyor...", holder: "Leo Search'e sor...", dir: "ltr" },
            ru: { welcome: "Привет, {name}, я Leo Search, меня отличает креативность", load: "Поиск в глубинах интернета...", holder: "Спроси Leo Search...", dir: "ltr" },
            no: { welcome: "Hei {name}, jeg er Leo Search, jeg er preget av kreativitet", load: "Søker i dypet av internett...", holder: "Spør Leo Search...", dir: "ltr" }
        };

        function initLeo() {
            const input = document.getElementById('user-name-input');
            if(!input.value.trim()) return;
            globalName = input.value.trim();
            document.getElementById('name-gate').style.display = 'none';
            const splash = document.getElementById('splash');
            splash.style.display = 'flex';
            setTimeout(() => {
                splash.style.display = 'none';
                const ui = document.getElementById('main-ui');
                ui.style.display = 'flex';
                setTimeout(() => ui.style.opacity = '1', 50);
                switchLang();
            }, 2500);
        }

        function applyTheme(c) {
            document.documentElement.style.setProperty('--main-bg', c);
            const r = parseInt(c.substr(1,2),16), g = parseInt(c.substr(3,2),16), b = parseInt(c.substr(5,2),16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const tc = luminance > 0.5 ? "#000" : "#fff";
            document.documentElement.style.setProperty('--text-color', tc);
            document.documentElement.style.setProperty('--accent', tc);
        }

        function switchLang() {
            const l = document.getElementById('lang-menu').value;
            const d = langData[l] || langData['ar'];
            document.body.dir = d.dir;
            document.getElementById('welcome-msg').innerText = d.welcome.replace("{name}", globalName);
            document.getElementById('loading-text').innerText = d.load;
            document.getElementById('user-query').placeholder = d.holder;
        }

        async function executeLeoSearch() {
            const q = document.getElementById('user-query').value.trim();
            const l = document.getElementById('lang-menu').value;
            if(!q) return;

            const box = document.getElementById('results-box');
            const loader = document.getElementById('loading-text');
            box.innerHTML = '';
            loader.style.display = 'block';

            try {
                // استخدام الموديل الأسرع مع خاصية البحث المباشر
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Search the web and answer professionally in ${l}. If the result is a software or website, include the direct link. Question: ${q}` }] }],
                        tools: [{ "google_search": {} }]
                    })
                });

                const data = await response.json();
                loader.style.display = 'none';

                if(data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    const meta = data.candidates[0].groundingMetadata || {};
                    const sources = meta.groundingAttributions || [];

                    let html = `<div class="res-item"><h3>${q}</h3><p>${reply.replace(/\n/g, '<br>')}</p>`;
                    if(sources.length > 0) {
                        html += `<div style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.2); padding-top:10px;">`;
                        sources.forEach(s => {
                            if(s.web) html += `<a href="${s.web.uri}" target="_blank" class="link-btn">زيارة الموقع الرسمي 🔗</a> `;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                    box.innerHTML = html;
                    box.scrollIntoView({behavior: 'smooth'});
                }
            } catch (err) {
                loader.style.display = 'none';
                box.innerHTML = '<div class="res-item">عذراً، تعذر الوصول للإنترنت حالياً.</div>';
            }
        }

        document.getElementById('user-query').addEventListener('keypress', (e) => { if(e.key === 'Enter') executeLeoSearch(); });
    </script>
